name: Build and Render

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

env:
  GHC_VERSION: "9.6.7"

jobs:
  compile:
    name: Compile with GHC
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Cache GHC
        uses: actions/cache@v4
        with:
          path: ~/.ghcup
          key: ghc-${{ runner.os }}-${{ env.GHC_VERSION }}
          restore-keys: ghc-${{ runner.os }}-

      - name: Setup GHC
        uses: haskell-actions/setup@v2
        with:
          ghc-version: ${{ env.GHC_VERSION }}
          enable-stack: false
          cabal-update: false

      - name: Verify GHC version
        run: ghc --version

      - name: Compile Literate Haskell files
        run: make all

      - name: Upload compiled executables
        uses: actions/upload-artifact@v4
        with:
          name: executables
          path: public/*
          if-no-files-found: error
          retention-days: 1

  render:
    name: Render HTML with Pandoc
    runs-on: ubuntu-latest
    needs: compile

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Pandoc
        run: |
          sudo apt-get update
          sudo apt-get install -y pandoc

      - name: Verify Pandoc version
        run: pandoc --version

      - name: Render HTML files
        run: make html

      - name: Upload HTML artifacts
        uses: actions/upload-artifact@v4
        with:
          name: html-output
          path: public/*.html
          if-no-files-found: error
          retention-days: 7
